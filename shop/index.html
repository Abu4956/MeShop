<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeShop.</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-root="../">
    

    <main>
      <aside>
        <section>
          <title>Colors</title>
          <ul>
            <li>
              <input id="red" type="checkbox" name="color" />
              <label for="red">Red</label>
            </li>
            <li>
              <input id="blue" type="checkbox" name="color" />
              <label for="blue">Blue</label>
            </li>
            <li>
              <input id="green" type="checkbox" name="color" />
              <label for="green">Green</label>
            </li>
            <li>
              <input id="black" type="checkbox" name="color" />
              <label for="black">Black</label>
            </li>
            <li>
              <input id="white" type="checkbox" name="color" />
              <label for="white">White</label>
            </li>
          </ul>
        </section>
        <section>
          <title>Sizes</title>
          <ul>
            <li>
              <input id="s" type="checkbox" name="size" />
              <label for="s">S</label>
            </li>
            <li>
              <input id="m" type="checkbox" name="size" />
              <label for="m">M</label>
            </li>
            <li>
              <input id="l" type="checkbox" name="size" />
              <label for="l">L</label>
            </li>
            <li>
              <input id="xl" type="checkbox" name="size" />
              <label for="xl">XL</label>
            </li>
          </ul>
        </section>
        <section>
          <title>Rating</title>
          <input
            type="range"
            id="range"
            min="0"
            max="5"
            value="0"
            
          />
          <div class="scale"><span>0</span><span>5</span></div>
        </section>
        <section>
          <title>Price Range</title>
          <ul>
            <li>
              <input id="0-25" type="checkbox" name="prange" />
              <label for="0-25">$0 to $25</label>
            </li>
            <li>
              <input id="25-50" type="checkbox" name="prange" />
              <label for="25-50">$25 to $50</label>
            </li>
            <li>
              <input id="50-100" type="checkbox" name="prange" />
              <label for="50-100">$50 to $100</label>
            </li>
            <li>
              <input id="100on" type="checkbox" name="prange" />
              <label for="100on">$100 onwards</label>
            </li>
          </ul>
        </section>
        <section><button id="apply" class="apply">Apply Filter</button></section>
      </aside>
      <main-content>
        <div class="topbar"><div class="searchbox"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M21 21l-6-6"/></svg><input type="text" id="search" placeholder="Search" aria-label="Search products by name" /></div>
          <label class="sortbox">Sort by
            <select id="sort" aria-label="Sort products">
              <option value="default">Featured</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="rating">Rating: high to low</option>
              <option value="name">Name: A to Z</option>
            </select>
          </label>
        </div>
        <div class="filters" id="filters">
          <div class="filter active" data-cat="all">All</div>
          <div class="filter" data-cat="men's clothing">Mens</div>
          <div class="filter" data-cat="women's clothing">Womens</div>
          <div class="filter" data-cat="jewelery">Jewellery</div>
          <div class="filter" data-cat="electronics">Electronics</div>
        </div>
        <div id="results"><p>Loading products...</p></div>
      </main-content>
    </main>
      <script src="../script.js"></script>
    <script src="script.js"></script>
  </body>
</html>
