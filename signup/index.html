<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Signup | MeShop.</title><link rel="stylesheet" href="../styles.css" /></head>
  <body data-root="../">
    <main class="form">
      <h1>Create your account</h1>
      <form id="f">
        <label>First name<input id="n" required /></label>
        <label>Last name<input id="ln" required /></label>
        <label>Email<input id="e" type="email" required /></label>
        <label>Password<input id="p" type="password" minlength="6" required /></label>
        <label>Confirm password<input id="c" type="password" required /></label>
        <div class="msg" id="m"></div>
        <button>Sign up</button>
      </form>
      <p>Already have an account? <a href="../login/">Log in</a></p>
    </main>
    <script src="../script.js"></script>
    <script src="script.js"></script>
  </body>
</html>
